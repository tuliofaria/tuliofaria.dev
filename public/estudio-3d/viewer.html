<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estúdio DevPleno · 3D</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf3f8;background:#12171f}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(ellipse at 53% 42%,#303b49 0,#19212b 47%,#0e131a 100%)}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:30px;left:32px;pointer-events:none}header small{font-size:11px;text-transform:uppercase;letter-spacing:.26em;color:#8aa0b7}h1{font-size:25px;margin:7px 0 0;font-weight:650;letter-spacing:-.04em}h1 span{color:#2db9ff}.hint{position:fixed;bottom:90px;left:0;right:0;text-align:center;color:#9cabb9;font-size:12px;pointer-events:none}.toolbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:8px;background:#101820e8;border:1px solid #ffffff1a;border-radius:15px;box-shadow:0 8px 35px #0004;backdrop-filter:blur(16px);max-width:calc(100% - 24px)}button{border:0;border-radius:9px;background:transparent;color:#c9d5df;padding:11px 13px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}button:hover{background:#ffffff14}button[aria-pressed=true]{background:#123e55;color:#78d4ff}button:focus-visible,input:focus-visible{outline:2px solid #47c3ff;outline-offset:2px}.divider{height:22px;width:1px;background:#ffffff1c;margin:0 5px}.exposure{display:flex;align-items:center;gap:8px;font-size:12px;padding:0 8px;color:#a4b4c2}.exposure input{width:75px;accent-color:#2db9ff}#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#131d28ed;padding:20px 28px;border-radius:14px;font-size:14px;text-align:center;max-width:90vw;box-shadow:0 12px 50px #0006}#status[hidden]{display:none}.error{color:#ffb6a8}@media(max-width:640px){header{top:20px;left:20px}h1{font-size:21px}.toolbar{bottom:16px;gap:0;padding:6px;flex-wrap:wrap;justify-content:center;width:max-content}button{padding:10px 9px;font-size:11px}.exposure,.divider{display:none}.hint{bottom:76px;font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<canvas aria-label="Estúdio DevPleno em 3D. Arraste para girar e use a roda do mouse ou dois dedos para aproximar."></canvas>

<div id="status" role="status" aria-live="polite">Abrindo o estúdio…</div>
<p class="hint">Arraste para explorar · Role ou use dois dedos para aproximar</p>
<nav class="toolbar" aria-label="Controles da cena"><button data-view="iso" aria-pressed="true">Isométrica</button><button data-view="front" aria-pressed="false">Frontal</button><button data-view="top" aria-pressed="false">Superior</button><span class="divider"></span><button id="rotate" aria-pressed="false">Girar</button><button id="reset">Reiniciar</button><label class="exposure">Luz <input id="light" aria-label="Intensidade da iluminação" type="range" min="0.5" max="1.8" step="0.05" value="1"></label></nav>
<script src="./viewer.js" defer></script></body></html>
